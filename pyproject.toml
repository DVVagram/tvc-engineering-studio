[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "static-rocket-flight-simulator"
version = "0.1.0"
description = "3D flight simulator for one fixed fin-stabilised rocket, where only the motor's performance is editable."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Static Rocket Flight Simulator contributors" }]
keywords = ["rocketry", "simulation", "flight-dynamics", "3d", "PySide6", "pyqtgraph"]
classifiers = [
  "Environment :: Win32 (MS Windows)",
  "Environment :: MacOS X",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

dependencies = [
  "numpy>=2.0",
  "PySide6>=6.6",
  "pyqtgraph>=0.13",
  "PyOpenGL>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
packaging = ["pyinstaller>=6.0"]

[project.scripts]
rocket-sim = "rocket_sim.app:main"

[project.gui-scripts]
rocket-sim-gui = "rocket_sim.app:main"

[tool.setuptools.packages.find]
include = ["rocket_sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
