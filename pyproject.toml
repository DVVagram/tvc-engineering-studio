[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tvc-engineering-studio"
version = "0.1.0"
description = "Integrated CAD, assembly, fastener, mechanical-dynamics and 6-DOF flight simulation environment for Thrust Vector Control rockets."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TVC Engineering Studio contributors" }]
keywords = ["CAD", "rocketry", "TVC", "simulation", "OCCT", "engineering"]
classifiers = [
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

dependencies = [
  "numpy>=2.0",
  "scipy>=1.11",
  "PySide6>=6.6",
  "pyqtgraph>=0.13",
  "PyOpenGL>=3.1",
  "cadquery-ocp>=7.7; sys_platform == 'win32' or sys_platform == 'linux'",
]

[project.optional-dependencies]
hardware = ["pyserial>=3.5"]
dev = ["pytest>=8.0"]
packaging = ["pyinstaller>=6.0"]

[project.scripts]
tvc-studio = "tvc_studio.app:main"

[project.gui-scripts]
tvc-studio-gui = "tvc_studio.app:main"

[tool.setuptools.packages.find]
include = ["tvc_studio*"]

[tool.setuptools.package-data]
"tvc_studio" = ["resources/**/*", "resources/**/*.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
